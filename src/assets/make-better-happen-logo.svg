<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="760" height="160" fill="none">
  <defs>
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0047FF" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0047FF" />
    </linearGradient>
  </defs>

  <!-- Left Vertical Gradient Bar -->
  <rect x="24" y="24" width="12" height="112" rx="6" fill="url(#cyanBlueGrad)" />

  <!-- "Make" -->
  <text x="64" y="104" font-family="'Sora', 'Manrope', 'Helvetica Neue', sans-serif" font-size="64" font-weight="700" fill="#0B132B">Make </text>

  <!-- "Better" -->
  <text x="244" y="104" font-family="'Sora', 'Manrope', 'Helvetica Neue', sans-serif" font-size="64" font-weight="800" fill="url(#textGrad)">Better </text>

  <!-- "Happen" -->
  <text x="474" y="104" font-family="'Sora', 'Manrope', 'Helvetica Neue', sans-serif" font-size="64" font-weight="700" fill="#0B132B">Happen</text>
</svg>
